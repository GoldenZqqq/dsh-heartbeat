# The heartbeat bundle patch: inserts the heartbeat web plugin into the
# composed configuration. Applied when a profile lists this bundle
# (dsh plugin add dsh-heartbeat). The row references
# the package by name; Node resolution finds the installed code in the
# profile, and the dsh.client declaration makes the client-modules table
# serve its browser half at /plugins/dsh-heartbeat/client.js.

- insert:
    - id: ui-heartbeat
      name: 'dsh-heartbeat'

# If the UI earlier declares a shell.overlay but no sidebar.header.dock, the
# browser half falls back to a floating bottom-right card automatically, so
# this bundle installs cleanly on stock DSH builds.
